[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cis-audit-agent"
version = "1.0.0"
description = "Read-only CIS-benchmark-style audit agent for Linux hosts"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30"]

[project.scripts]
audit-agent = "audit_agent.cli:main"

[tool.setuptools]
packages = ["audit_agent"]
